<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Modcloth</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <img src="../img/logo.png" alt="Modcloth Logo">
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Finaliza Tu Compra</h2>
            <form action="#" method="post">
                <label for="name">Nombre Completo:</label>
                <input type="text" id="name" name="name" required>

                <label for="address">Dirección de Envío:</label>
                <input type="text" id="address" name="address" required>

                <label for="city">Ciudad:</label>
                <input type="text" id="city" name="city" required>

                <label for="state">Estado/Provincia:</label>
                <input type="text" id="state" name="state" required>

                <label for="zip">Código Postal:</label>
                <input type="text" id="zip" name="zip" required>

                <label for="country">País:</label>
                <input type="text" id="country" name="country" required>

                <label for="card">Número de Tarjeta:</label>
                <input type="text" id="card" name="card" required>

                <label for="exp-date">Fecha de Expiración:</label>
                <input type="text" id="exp-date" name="exp-date" required>

                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" name="cvv" required>

                <button type="submit" class="cta-button">Completar Compra</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Modcloth. Todos los derechos reservados. Contacto: <a href="mailto:support@modcloth.com">support@modcloth.com</a></p>
    </footer>
    <script src="../js/scripts.js"></script>
</body>
  </html>
